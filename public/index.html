<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khaliji Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="closedView" class="closed-wrap hidden">
  <div class="closed-card">
    <p class="eyebrow">Khaliji Shop</p>
    <h1>LAGI TUTUP</h1>
    <p class="sub">Toko sedang istirahat sebentar. Silakan kembali lagi nanti ya 🤍</p>
  </div>
</div>

<div id="appView" class="hidden">

  <header class="site-header">
    <p class="eyebrow">Khaliji Shop</p>
    <h1>Belanja nyaman, gaya kamu ✨</h1>
    <p class="sub">Pilih kategori di bawah untuk lihat koleksi terbaru.</p>
  </header>

  <!-- VIEW 1: kategori -->
  <section id="categoryView" class="view">
    <div id="categoryGrid" class="category-grid"></div>
  </section>

  <!-- VIEW 2: daftar produk per kategori -->
  <section id="listView" class="view hidden">
    <button class="btn-back" id="backToCategoryBtn">&larr; Kembali ke Kategori</button>
    <h2 id="listCategoryTitle" class="section-title"></h2>
    <div id="productGrid" class="product-grid"></div>
  </section>

  <!-- VIEW 3: detail produk + form pesan -->
  <section id="detailView" class="view hidden">
    <button class="btn-back" id="backToListBtn">&larr; Kembali</button>
    <div class="detail-card">
      <div class="detail-image-wrap">
        <img id="detailImage" src="" alt="">
      </div>
      <div class="detail-info">
        <p class="cat" id="detailCategory"></p>
        <h2 id="detailTitle"></h2>
        <p class="detail-price" id="detailPrice"></p>
        <p class="detail-desc" id="detailDesc"></p>

        <form id="orderForm">
          <h3>Form Pemesanan</h3>
          <label>Nama
            <input type="text" id="orderName" required placeholder="Nama kamu">
          </label>
          <label>Daerah / Kota
            <input type="text" id="orderRegion" required placeholder="Contoh: Banjarmasin">
          </label>
          <label>No. WhatsApp / No. Telp
            <input type="tel" id="orderPhone" required placeholder="Contoh: 08xxxxxxxxxx">
          </label>
          <button type="submit" class="btn-primary">Pesan via WhatsApp</button>
        </form>
      </div>
    </div>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
